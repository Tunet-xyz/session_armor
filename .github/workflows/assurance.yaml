name: Security assurance

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  package-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install ".[dev]" -r requirements/build.in
      - name: Run adversarial and release suites
        run: >-
          pytest tests/test_session.py tests/test_gate.py tests/test_audit.py
          tests/test_mcp_server.py tests/test_release_tools.py
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m tools.generate_sbom
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'session_armor/py.typed' in z.namelist()"
