name: Security assurance

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  assurance:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      # The same hash-locked build as publish.yaml, so the checked artifacts are
      # the ones a release ships. The lock also pins pip itself.
      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements/build.txt
      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      # Build with the hash-locked setuptools and wheel installed above; an isolated
      # build would fetch an unpinned, unhashed backend from PyPI instead.
      - name: Build distributions
        run: python -m build --no-isolation --outdir dist/packages
      - name: Validate package metadata
        run: python -m twine check dist/packages/*
      - name: Generate SPDX SBOM
        run: python -m tools.generate_sbom --dist dist/packages --output dist/evidence/sessionarmor.spdx.json
      - name: Validate SPDX SBOM
        run: pyspdxtools -i dist/evidence/sessionarmor.spdx.json
      - name: Check that the wheel ships py.typed
        run: python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/packages/*.whl')[0]); assert 'session_armor/py.typed' in z.namelist()"
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Run adversarial and release suites
        run: >-
          pytest tests/test_session.py tests/test_gate.py tests/test_audit.py
          tests/test_mcp_server.py tests/test_release_tools.py
