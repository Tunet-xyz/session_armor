name: Publish to PyPI

on:
  workflow_dispatch:

permissions: {contents: read}
concurrency: {group: "pypi-publish-${{ github.ref }}", cancel-in-progress: false}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      # workflow_dispatch can run from any branch, so release only from main or
      # from the tag that matches the package version.
      - name: Require main or the matching version tag
        env: {REF: "${{ github.ref }}"}
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          case "$REF" in
            refs/heads/main|"refs/tags/v$version") ;;
            *) echo "::error::Publish from main or tag v$version, not $REF."; exit 1 ;;
          esac
      - run: python -m pip install ".[dev]"
      - name: Lint, type check and test
        run: |
          ruff check src tests tools
          mypy src/session_armor --ignore-missing-imports
          pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install --require-hashes -r requirements/build.txt
      # Build with the hash-locked setuptools and wheel installed above; an isolated
      # build would fetch an unpinned, unhashed backend from PyPI instead.
      - run: python -m build --no-isolation --outdir dist/packages
      - run: python -m twine check dist/packages/*
      - name: Generate release evidence
        run: |
          python -m tools.generate_sbom --dist dist/packages --output dist/evidence/sessionarmor.spdx.json
          sha256sum dist/packages/* dist/evidence/* > dist/evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: release-distributions, path: dist/, if-no-files-found: error}

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: {name: pypi, url: "https://pypi.org/p/SessionArmor"}
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: {packages-dir: dist/packages, print-hash: true}
