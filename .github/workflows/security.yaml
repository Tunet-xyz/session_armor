name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC (catches newly disclosed CVEs)

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Static security analysis (bandit)
      # Blocking: scans our own source for insecure patterns.
      run: bandit -r src/session_armor

    - name: Dependency vulnerability audit (pip-audit)
      # Non-blocking: advisories in transitive/runtime deps shouldn't fail an
      # unrelated PR, but they should be surfaced in the run logs.
      run: pip-audit
      continue-on-error: true
