name: Tests

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2"]
        exclude:
          - {python-version: "3.13", django-version: "4.2"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install --upgrade "pip==26.2.1"
      - name: Install
        run: python -m pip install ".[dev]" "Django~=${{ matrix.django-version }}.0"
      - name: Lint
        run: ruff check src tests tools
      - name: Type check
        run: mypy src/session_armor --ignore-missing-imports
      - name: Test with branch coverage
        run: pytest --cov=session_armor --cov-branch --cov-report=term-missing --cov-fail-under=80
