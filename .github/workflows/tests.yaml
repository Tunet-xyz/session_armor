name: Tests

on:
  workflow_dispatch:
permissions: {contents: read}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2"]
        exclude:
          - {python-version: "3.13", django-version: "4.2"}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install --upgrade "pip==26.2.1"
      - name: Install
        run: python -m pip install ".[dev]" "Django~=${{ matrix.django-version }}.0"
      - name: Lint
        run: ruff check src tests tools
      - name: Type check
        run: mypy src/session_armor --ignore-missing-imports
      - name: Test with branch coverage
        run: pytest --cov=session_armor --cov-branch --cov-report=term-missing
