name: Tests

on:
  workflow_dispatch:
permissions: {contents: read}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.1"]
        exclude:
          # Django 6 needs Python 3.12 or later.
          - {python-version: "3.10", django-version: "6.1"}
          - {python-version: "3.11", django-version: "6.1"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install ".[dev]" "Django~=${{ matrix.django-version }}.0"
      - name: Lint
        run: ruff check src tests tools
      - name: Type check
        run: mypy src/session_armor --ignore-missing-imports
      - name: Test
        run: pytest --cov=session_armor --cov-branch --cov-report=term-missing

  minimum-dependencies:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.10"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install ".[dev]" "Django>=4.2,<4.3"
      - name: Test
        run: pytest
