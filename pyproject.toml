[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["session_armor*"]

[tool.setuptools.package-data]
session_armor = ["py.typed", "mcp/*.json"]

[project]
name = "SessionArmor"
version = "0.4.0"
description = "Security-focused Django middleware for session integrity, privacy-aware audit logging, and configurable request gates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["django", "middleware", "security", "session", "audit", "gates", "nist", "owasp"]
authors = [
  { name = "Tunet Ltd", email = "alex@tunet.xyz" },
]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Intended Audience :: Developers",
]
dependencies = [
  "Django>=4.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.5",
  "pytest-cov>=4.0.0",
  "ruff>=0.4",
  "mypy>=1.0.0",
  "django-stubs>=4.2.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/Tunet-xyz/session_armor"
Product = "https://tunet.xyz/engineering/session-armor/"
Documentation = "https://github.com/Tunet-xyz/session_armor#readme"
Repository = "https://github.com/Tunet-xyz/session_armor"
Issues = "https://github.com/Tunet-xyz/session_armor/issues"
Changelog = "https://github.com/Tunet-xyz/session_armor/blob/main/CHANGELOG.md"

[project.scripts]
sessionarmor-mcp = "session_armor.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
  "B904",  # Within except clause, raise with from err
]

[tool.ruff.lint.isort]
known-first-party = ["session_armor"]

[tool.coverage.run]
source = ["src/session_armor"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]
